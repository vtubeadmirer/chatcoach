# vendored from vtubeadmirer/clipslicer@07d13cc (.github/workflows/ci.yml) — 변경: 액션 커밋 SHA 고정, 권한 최소화, 해시 고정 설치, 버전 파일 동기화 확인, local_only 제외 전체 테스트
name: CI

# push(main)·PR 마다 release.yml build 잡의 2~4단계에 해당하는 검사만 돈다 (docs/design/04-update-and-release.md 4-3).
# 빌드·ffmpeg 다운로드는 하지 않는다.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions: {}                      # 기본은 아무 권한 없음. 잡마다 필요한 것만 연다

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          persist-credentials: false         # 토큰을 .git/config 에 남기지 않는다

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # pwsh 단계는 마지막 명령의 종료 코드만 보므로 명령을 한 단계에 하나씩 둔다
      - name: pip 고정
        run: python -m pip install pip==25.2

      - name: 의존성 설치 (해시 고정)
        run: python -m pip install --require-hashes -r requirements.lock

      - name: 문법 검사
        run: python -m compileall -q main.py app engine tools tests

      - name: 버전 파일 동기화 확인
        run: python tools/sync_version.py --check

      - name: 단위 테스트 (로컬 전용 제외)
        run: python -m pytest -q -m "not local_only"
